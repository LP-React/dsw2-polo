spring.application.name=bibliotec
# Permite cargar .env también al ejecutar con Maven desde la raíz del proyecto.
spring.config.import=optional:file:.env[.properties]
server.port=${PORT:8080}
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/bibliotec_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:mysql}
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Administrador inicial para desarrollo. En despliegue, cambiar ambas variables.
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD:Admin12345}

# Frontend Next.js
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Descubrimiento de servicios con Eureka
eureka.client.enabled=${EUREKA_ENABLED:true}
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true
